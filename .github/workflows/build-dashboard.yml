name: Build Dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    # Skip if commit message contains [skip ci]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard-source/package-lock.json
      
      - name: Install dashboard dependencies
        run: |
          cd dashboard-source
          npm ci
      
      - name: Build dashboard
        run: |
          cd dashboard-source
          npm run build
      
      - name: Copy dashboard files
        run: |
          # Remove old dashboard files
          rm -rf dashboard/*
          
          # Copy built files
          cp -r dashboard-source/dist dashboard/
          cp dashboard-source/index.html dashboard/index.html
      
      - name: Inject analytics script
        run: |
          python3 << 'PYTHON_EOF'
          analytics_script = '''    <script defer src="https://analytics.stashbot.app/script.js"
            data-website-id="99f9efc4-7295-464b-b9ed-7cb0ce628107"></script>'''
          
          with open('dashboard/index.html', 'r') as f:
              content = f.read()
          
          # Find </head> and insert analytics script before it
          if '</head>' in content:
              content = content.replace('</head>', analytics_script + '\n</head>')
              with open('dashboard/index.html', 'w') as f:
                  f.write(content)
              print("Analytics script injected successfully")
          else:
              print("Warning: </head> tag not found in index.html")
              exit(1)
          PYTHON_EOF
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dashboard/
          if ! git diff --staged --quiet; then
            git commit -m "Update dashboard from pi-splay [skip ci]"
            git push origin main
          else
            echo "No changes to commit"
          fi

